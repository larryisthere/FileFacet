      openSmartMenu(event);
    });
    document.getElementById("smartSelect").addEventListener("keydown", event => {
      if (smartRenameActive || !["Enter", " "].includes(event.key)) return;
      event.preventDefault();
      requestNavigation({ view: "smart" });
    });
    document.getElementById("renameSmartButton").addEventListener("click", beginSmartRename);
    document.getElementById("smartRenameInput").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        event.stopPropagation();
        commitSmartRename();
      } else if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        cancelSmartRename();
      }
    });
    document.getElementById("smartRenameInput").addEventListener("input", event => {
      event.currentTarget.classList.remove("invalid");
    });
    document.getElementById("smartRenameInput").addEventListener("blur", commitSmartRename);
    document.getElementById("deleteSmartButton").addEventListener("click", () => {
      document.getElementById("deleteTitle").textContent = `删除“${savedRule.name}”？`;
      deleteBackdrop.hidden = false;
      closeFloating();
    });
    document.getElementById("cancelDeleteButton").addEventListener("click", () => { deleteBackdrop.hidden = true; });
    document.getElementById("confirmDeleteButton").addEventListener("click", () => {
      savedRule = null;
      smartRenameActive = false;
      currentView = "all";
      deleteBackdrop.hidden = true;
      clearTemporaryRule();
    });
    deleteBackdrop.addEventListener("click", event => {
      if (event.target === deleteBackdrop) deleteBackdrop.hidden = true;
    });
    document.getElementById("cancelLeaveButton").addEventListener("click", () => {
      pendingNavigation = null;
      leaveBackdrop.hidden = true;
    });
    document.getElementById("discardLeaveButton").addEventListener("click", () => {
      if (!pendingNavigation) return;
      const target = pendingNavigation;
      performNavigation(target);
    });
    document.getElementById("updateLeaveButton").addEventListener("click", () => {
      if (!pendingNavigation) return;
      const target = pendingNavigation;
      updateSavedRule();
      performNavigation(target);
    });
    leaveBackdrop.addEventListener("click", event => {
      if (event.target !== leaveBackdrop) return;
      pendingNavigation = null;
      leaveBackdrop.hidden = true;
    });
    document.getElementById("emptyClearButton").addEventListener("click", clearTemporaryRule);

    document.querySelectorAll("[data-demo-state]").forEach(button => {
      button.addEventListener("click", () => setDemoState(button.dataset.demoState));
    });
    document.addEventListener("click", event => {
      const insideFloating = event.target.closest(".menu, #smartAction");
      if (!insideFloating) closeFloating();
      const insideEditor = event.target.closest("#editorPopover, [data-open-add], [data-edit-filename], [data-edit-required-tag], [data-edit-match], [data-edit-condition], [data-edit-sort], [data-demo-state]");
      if (!insideEditor && activeEditor) closeEditor();
    });
    document.addEventListener("keydown", event => {
      if (event.metaKey && !event.altKey && event.key.toLocaleLowerCase() === "f") {
        event.preventDefault();
        if (event.shiftKey) {
          const addButton = ruleBar.querySelector("[data-open-add]");
          if (addButton) openEditor("add", addButton);
        } else {
          if (activeEditor) closeEditor();
          searchInput.focus();
          searchInput.select();
        }
        return;
      }
      if (event.key !== "Escape") return;
      if (smartRenameActive) cancelSmartRename();
      else if (!leaveBackdrop.hidden) {
        pendingNavigation = null;
        leaveBackdrop.hidden = true;
      }
      else if (!saveBackdrop.hidden) saveBackdrop.hidden = true;
      else if (!deleteBackdrop.hidden) deleteBackdrop.hidden = true;
      else if (activeEditor) closeEditor();
      else closeFloating();
    });

    renderGrid();
  </script>
</body>
</html>
